[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "magtel-toy-factory"
version = "0.2.0"
description = "Design and assemble editable toy parts in plain language and export them for 3D printing."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

[project.scripts]
magtel = "magtel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
